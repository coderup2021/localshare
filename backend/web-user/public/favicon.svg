<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">LocalShare</title>
  <desc id="desc">Three connected network nodes representing private local communication and sharing.</desc>

  <defs>
    <linearGradient id="tile" x1="72" y1="52" x2="428" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31845A" />
      <stop offset="0.55" stop-color="#1D5A40" />
      <stop offset="1" stop-color="#123A29" />
    </linearGradient>
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="translate(122 82) rotate(45) scale(390)"
    >
      <stop offset="0" stop-color="#A9EDC1" stop-opacity="0.24" />
      <stop offset="0.58" stop-color="#79D49A" stop-opacity="0.06" />
      <stop offset="1" stop-color="#79D49A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tile)" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)" />
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="112"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.16"
    stroke-width="4"
  />

  <g fill="none" stroke="#79D49A" stroke-linecap="round" stroke-linejoin="round" stroke-width="28">
    <path d="M256 172L160 340" />
    <path d="M256 172L352 340" />
    <path d="M160 340H352" />
  </g>
  <circle cx="256" cy="172" r="42" fill="#F6EBCF" />
  <circle cx="160" cy="340" r="42" fill="#F6EBCF" />
  <circle cx="352" cy="340" r="42" fill="#F6EBCF" />
</svg>
