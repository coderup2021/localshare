name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app-desktop/**'
      - 'backend/server/**'
      - 'packages/contracts/**'
      - 'scripts/test-desktop-e2e.ts'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2022
          - name: macos-x64
            os: macos-13
          - name: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Linux WebKit runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb
      - run: bun install --frozen-lockfile
      - run: bun run --cwd app-desktop test
      - run: bun run --cwd app-desktop typecheck
      - run: bun run --cwd app-desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: localshare-desktop-${{ matrix.name }}
          path: |
            app-desktop/artifacts/**
            app-desktop/build/**
          if-no-files-found: error

  linux-e2e:
    name: Linux native E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb
      - run: bun install --frozen-lockfile
      - run: bun run test:desktop:e2e
