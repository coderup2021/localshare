name: Server package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/server/**'
      - 'backend/web-admin/**'
      - 'backend/web-user/**'
      - 'packages/contracts/**'
      - 'scripts/pack-server.ts'
      - 'scripts/install-local.ts'
      - 'scripts/verify-local-install.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/server.yml'

jobs:
  browser-e2e:
    name: Browser E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2022
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  native-install:
    name: Native npm lifecycle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2022
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --cwd backend/server typecheck
      - run: bun run --cwd backend/server test
      - run: bun run install:local
      - run: bun run verify:local
